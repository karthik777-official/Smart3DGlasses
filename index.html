<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VISIONAID AI — ASSISTIVE VISION SYSTEM</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- Three.js Import Map using modern ES modules -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body class="dark-theme">
  <div id="app-container">
    <!-- 3D WebGL Canvas Viewport -->
    <div id="canvas-container"></div>

    <!-- Animated Callout Leader Line Layer -->
    <canvas id="callout-canvas"></canvas>

    <!-- On-Model Exploded Component Labels (Visible only in Exploded Mode) -->
    <div id="hotspot-overlay"></div>

    <!-- Minimal Clean Header -->
    <header class="app-header">
      <div class="brand-block">
        <h1 class="brand-title">VISIONAID AI</h1>
        <p class="brand-subtitle">ASSISTIVE VISION SYSTEM</p>
      </div>

      <div class="header-right">
        <div class="status-badge">
          <span class="status-dot"></span>
          <span>ONLINE</span>
        </div>
        <button id="btn-theme" class="btn-icon" title="Toggle Studio Lighting">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- Single Compact Specification Card (Fixed on Right Side) -->
    <aside id="spec-card" class="spec-card" aria-live="polite">
      <div class="spec-header">
        <div class="spec-title-wrap">
          <span id="spec-num" class="spec-num">[01]</span>
          <div class="spec-name-block">
            <h2 id="spec-title" class="spec-title">RGB CAMERA</h2>
            <span id="spec-subtitle" class="spec-subtitle">VISION SENSOR SUBSYSTEM</span>
          </div>
        </div>
        <button id="spec-close" class="spec-close-btn" aria-label="Close card">&times;</button>
      </div>

      <div id="spec-arch" class="spec-arch-tag">Sony Quad-Bayer High-Speed CMOS</div>

      <div id="spec-grid" class="spec-grid">
        <!-- Injected dynamically: 4 structured spec rows -->
      </div>

      <div class="spec-impact-box">
        <div class="spec-impact-header">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
          <span>ASSISTIVE IMPACT</span>
        </div>
        <p id="spec-impact-desc" class="spec-impact-desc">Real-time scene analysis and OCR text reading.</p>
      </div>

      <div class="spec-footer">
        <span id="spec-telemetry" class="spec-telemetry">Power: 420 mW | Status: OPERATIONAL</span>
        <span class="spec-status-pill">● FOCUS MODE</span>
      </div>
    </aside>

    <!-- Compact Floating Bottom Control Dock -->
    <nav class="bottom-controls">
      <!-- 4 Inspection Views -->
      <div class="control-group">
        <button id="btn-prev-view" class="btn-ctrl btn-arrow" title="Previous View (←)">←</button>
        <span id="view-indicator" class="view-indicator">01 FRONT</span>
        <button id="btn-next-view" class="btn-ctrl btn-arrow" title="Next View (→)">→</button>
      </div>

      <!-- Real Working Model Rotation -->
      <button id="btn-rotate" class="btn-ctrl btn-rotate" title="Toggle Model Rotation">
        <span class="rotate-dot"></span>
        <span id="rotate-label">ROTATE</span>
      </button>

      <!-- Exploded View Action -->
      <button id="btn-explode" class="btn-ctrl btn-explode" title="Toggle Exploded Assembly">
        <span id="explode-label">EXPLODE VIEW</span>
      </button>

      <!-- Zoom Controls -->
      <div class="control-group">
        <button id="btn-zoom-out" class="btn-ctrl btn-zoom" title="Zoom Out (−)">−</button>
        <button id="btn-zoom-in" class="btn-ctrl btn-zoom" title="Zoom In (+)">+</button>
      </div>

      <!-- Reset Camera -->
      <button id="btn-reset-cam" class="btn-ctrl btn-reset" title="Reset Camera to Front View">RESET</button>
    </nav>
  </div>

  <!-- Main Application Script -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
